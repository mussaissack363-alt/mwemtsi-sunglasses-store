<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ONYX — Eyewear</title>
<style>
  :root{
    --bg:#000000;
    --panel:#0a0a0b;
    --panel-2:#131315;
    --line:#232326;
    --text:#f2f1ee;
    --muted:#75767c;
    --accent:#c9a24a;
    --wa:#25D366;
    --danger:#c9564a;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;background:var(--bg);color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;}
  body{height:auto;}

  /* Scroll spacer drives BOTH chapters: glasses arrival (first half),
     then transition + sunglasses arrival (second half) */
  #scroll-spacer{height:460vh;width:100%;}

  #logo{
    position:fixed;top:22px;left:24px;z-index:20;
    font-size:14px;letter-spacing:0.16em;font-weight:600;
    display:flex;align-items:baseline;gap:2px;
    pointer-events:none;user-select:none;
    animation:idleFloat 5.5s ease-in-out infinite;
    transform-origin:left center;
  }
  #logo .x{color:var(--accent);}
  @keyframes idleFloat{
    0%,100%{ transform: translateY(0) rotate(0deg); }
    50%{ transform: translateY(-2px) rotate(-0.6deg); }
  }

  #canvas-wrap{position:fixed;inset:0;z-index:0;}
  canvas{display:block;width:100%;height:100%;}

  #hero-starfield{
    position:fixed;inset:0;z-index:1;pointer-events:none;
    background: radial-gradient(circle at 32% 62%, #0e5b5d 0%, #062a2c 32%, #04080a 62%, #000000 100%);
  }
  #hero-starfield .star{position:absolute;border-radius:50%;background:#dff3f4;}

  #outro-line{
    position:fixed;left:0;right:0;top:44%;z-index:11;
    text-align:center;pointer-events:none;opacity:0;
  }
  #outro-line p{margin:0;font-size:22px;font-weight:500;color:var(--text);letter-spacing:-0.01em;}
  #outro-line p.sub{margin-top:6px;font-size:15px;font-weight:400;color:var(--muted);}
  @media (max-width:760px){
    #outro-line p{font-size:18px;}
    #outro-line p.sub{font-size:13px;}
  }

  #shop-info{
    position:fixed;top:24px;left:50%;transform:translateX(-50%);z-index:20;
    text-align:center;opacity:0;pointer-events:none;transition:opacity .3s ease;
  }
  #shop-info .si-loc{font-size:11px;letter-spacing:0.05em;color:var(--muted);}
  #shop-info .si-phones{margin-top:3px;display:flex;gap:12px;justify-content:center;}
  #shop-info .si-phones a{
    font-size:11px;color:var(--muted);text-decoration:none;letter-spacing:0.02em;
    transition:color .15s ease;
  }
  #shop-info .si-phones a:hover{color:var(--accent);}
  #shop-info .si-phones a.si-client{color:var(--text);}
  @media (max-width:760px){
    #shop-info{top:auto;bottom:88px;}
  }

  #chapter-fade{
    position:fixed;inset:0;z-index:25;background:#000;
    opacity:0;pointer-events:none;
  }
  #transition-words{
    position:fixed;left:0;right:0;top:46%;z-index:26;
    text-align:center;pointer-events:none;opacity:0;
  }
  #transition-words p{margin:0;font-size:22px;font-weight:500;color:var(--text);letter-spacing:-0.01em;}
  #transition-words p.sub{margin-top:6px;font-size:15px;font-weight:400;color:var(--muted);}
  @media (max-width:760px){
    #transition-words p{font-size:18px;}
    #transition-words p.sub{font-size:13px;}
  }

  #loading{
    position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
    background:var(--bg);color:var(--muted);font-size:13px;letter-spacing:0.02em;
    z-index:30;
  }

  #scroll-hint{
    position:fixed;left:0;right:0;bottom:40px;z-index:10;
    text-align:center;pointer-events:none;
    transition:opacity .5s ease;
  }
  #scroll-hint span{
    font-size:11px;letter-spacing:0.14em;color:var(--muted);
    text-transform:uppercase;
  }
  #scroll-hint .chev{
    display:block;margin:8px auto 0;width:1px;height:22px;
    background:linear-gradient(var(--muted), transparent);
    animation:chevDrop 1.8s ease-in-out infinite;
  }
  @keyframes chevDrop{
    0%{ opacity:0; transform:translateY(-6px); }
    50%{ opacity:1; }
    100%{ opacity:0; transform:translateY(6px); }
  }

  .hotspot{
    position:fixed;top:0;left:0;z-index:15;
    transform:translate(-50%,-50%);
    cursor:pointer;
    display:flex;align-items:center;gap:7px;
    transition:opacity .3s ease;
  }
  .hotspot .dot{
    width:8px;height:8px;border-radius:50%;
    background:var(--accent);
    box-shadow:0 0 0 4px rgba(201,162,74,0.15);
    animation:pulse 2.2s ease-in-out infinite;
    flex-shrink:0;
  }
  .hotspot .pill{
    background:rgba(10,10,11,0.8);
    backdrop-filter:blur(8px);
    border:1px solid var(--line);
    padding:5px 13px;
    border-radius:20px;
    font-size:11px;
    letter-spacing:0.03em;
    color:var(--text);
    white-space:nowrap;
    transition:border-color .15s ease;
  }
  .hotspot:hover .pill{border-color:var(--accent);}
  .hotspot.active .pill{border-color:var(--accent);color:var(--accent);}
  @keyframes pulse{
    0%,100%{ box-shadow:0 0 0 4px rgba(201,162,74,0.15); }
    50%{ box-shadow:0 0 0 9px rgba(201,162,74,0.05); }
  }

  #back-btn{
    position:fixed;top:24px;right:24px;z-index:20;
    background:transparent;border:1px solid var(--line);color:var(--muted);
    padding:8px 16px;font-size:11.5px;border-radius:20px;cursor:pointer;
    opacity:0;pointer-events:none;
    transition:opacity .2s ease, border-color .15s ease, color .15s ease;
  }
  #back-btn.visible{opacity:1;pointer-events:auto;}
  #back-btn:hover{border-color:var(--accent);color:var(--text);}

  #wa-btn{
    position:fixed;right:24px;bottom:24px;z-index:20;
    width:52px;height:52px;border-radius:50%;
    background:var(--wa);display:flex;align-items:center;justify-content:center;
    box-shadow:0 4px 18px rgba(0,0,0,0.5);
    text-decoration:none;
    transition:transform .15s ease;
  }
  #wa-btn:hover{transform:scale(1.06);}
  #wa-btn svg{width:26px;height:26px;fill:#fff;}

  #admin-toggle{
    position:fixed;left:24px;bottom:24px;z-index:20;
    background:transparent;border:1px solid var(--line);color:var(--muted);
    width:34px;height:34px;border-radius:50%;cursor:pointer;font-size:14px;
    display:flex;align-items:center;justify-content:center;
    transition:border-color .15s ease,color .15s ease;
  }
  #admin-toggle:hover{border-color:var(--accent);color:var(--accent);}
  #admin-toggle.on{border-color:var(--accent);color:var(--accent);background:#161209;}

  #drawer{
    position:fixed;left:0;right:0;bottom:0;z-index:18;
    background:linear-gradient(180deg, rgba(0,0,0,0) 0%, var(--panel) 24px, var(--panel) 100%);
    border-top:1px solid var(--line);
    padding:22px 24px 26px;
    transform:translateY(100%);
    opacity:0;
    transition:transform .55s cubic-bezier(.22,.9,.3,1), opacity .5s ease;
    max-height:44vh;
  }
  #drawer.open{transform:translateY(0);opacity:1;}

  #drawer-head{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:14px;}
  #drawer-title{font-size:20px;font-weight:600;letter-spacing:0.01em;margin:0;}
  #drawer-sub{font-size:11px;color:var(--muted);margin:2px 0 0;letter-spacing:0.02em;}

  #product-row{display:flex;gap:14px;overflow-x:auto;padding-bottom:6px;scroll-snap-type:x proximity;}
  #product-row::-webkit-scrollbar{height:5px;}
  #product-row::-webkit-scrollbar-thumb{background:var(--line);border-radius:4px;}

  .product-card{
    flex:0 0 auto;width:150px;
    background:var(--panel-2);border:1px solid var(--line);border-radius:6px;
    overflow:hidden;scroll-snap-align:start;position:relative;
  }
  .product-swatch{height:96px;width:100%;}
  .product-info{padding:10px 12px 12px;}
  .product-name{font-size:12.5px;font-weight:600;margin:0;}
  .product-price{font-size:12px;color:var(--accent);margin:3px 0 0;}
  .product-remove{
    position:absolute;top:6px;right:6px;width:20px;height:20px;border-radius:50%;
    background:rgba(0,0,0,0.6);border:1px solid var(--danger);color:var(--danger);
    font-size:11px;line-height:1;cursor:pointer;display:none;align-items:center;justify-content:center;
  }
  body.admin .product-remove{display:flex;}

  .add-card{
    flex:0 0 auto;width:150px;height:150px;
    border:1px dashed var(--line);border-radius:6px;
    display:none;align-items:center;justify-content:center;
    color:var(--muted);font-size:26px;cursor:pointer;background:transparent;
  }
  body.admin .add-card{display:flex;}
  .add-card:hover{border-color:var(--accent);color:var(--accent);}

  #modal-backdrop{position:fixed;inset:0;background:rgba(0,0,0,0.7);z-index:40;display:none;align-items:center;justify-content:center;}
  #modal-backdrop.open{display:flex;}
  #modal{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:22px;width:280px;}
  #modal h3{margin:0 0 14px;font-size:14px;}
  #modal label{display:block;font-size:11px;color:var(--muted);margin:10px 0 4px;}
  #modal input{width:100%;background:var(--panel-2);border:1px solid var(--line);color:var(--text);padding:8px 10px;border-radius:4px;font-size:13px;}
  #modal .modal-actions{display:flex;gap:8px;margin-top:18px;}
  #modal button{flex:1;padding:9px;border-radius:4px;font-size:12.5px;cursor:pointer;border:1px solid var(--line);}
  #modal-save{background:var(--accent);border-color:var(--accent);color:#181206;font-weight:600;}
  #modal-cancel{background:transparent;color:var(--muted);}

  #pin-backdrop{position:fixed;inset:0;background:rgba(0,0,0,0.7);z-index:40;display:none;align-items:center;justify-content:center;}
  #pin-backdrop.open{display:flex;}
  #pin-box{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:22px;width:240px;text-align:center;}
  #pin-box p{font-size:12px;color:var(--muted);margin:0 0 12px;}
  #pin-box input{width:100%;text-align:center;letter-spacing:0.3em;font-size:16px;background:var(--panel-2);border:1px solid var(--line);color:var(--text);padding:9px;border-radius:4px;}
  #pin-box button{margin-top:12px;width:100%;padding:9px;border-radius:4px;border:1px solid var(--accent);background:var(--accent);color:#181206;font-weight:600;cursor:pointer;font-size:12.5px;}
</style>
</head>
<body>

<div id="loading">Loading model…</div>

<div id="scroll-spacer"></div>

<div id="logo"><span class="o">ON</span><span class="x">Y</span><span class="o">X</span></div>

<div id="canvas-wrap"></div>
<div id="hero-starfield"></div>

<div id="shop-info">
  <div class="si-loc">Kariakoo · Open 08:00–18:00</div>
  <div class="si-phones">

<a id="wa-btn" href="https://wa.me/255753474748?text=Hi%2C%20I%27m%20interested%20in%20ONYX%20glasses" target="_blank" rel="noopener">
  <svg viewBox="0 0 24 24"><path d="M12.04 2C6.58 2 2.13 6.45 2.13 11.91c0 1.75.46 3.45 1.32 4.95L2.05 22l5.25-1.38a9.87 9.87 0 0 0 4.74 1.21h.01c5.46 0 9.91-4.45 9.91-9.91C21.96 6.45 17.5 2 12.04 2zm5.8 14.16c-.24.68-1.4 1.3-1.93 1.38-.5.08-1.11.11-1.79-.11-.41-.13-.94-.3-1.62-.6-2.85-1.23-4.71-4.09-4.85-4.28-.14-.19-1.16-1.55-1.16-2.96 0-1.4.74-2.09 1-2.38.26-.28.57-.35.76-.35h.55c.18 0 .42-.07.65.5.24.58.82 2 .89 2.15.07.15.12.32.02.51-.09.19-.14.3-.28.46-.14.16-.29.36-.42.48-.14.13-.28.28-.12.55.16.28.71 1.17 1.53 1.9 1.05.94 1.94 1.23 2.21 1.37.28.14.44.12.6-.07.16-.2.68-.79.86-1.06.18-.28.36-.23.61-.14.24.09 1.55.73 1.82.87.27.13.44.2.51.31.07.12.07.68-.17 1.35z"/></svg>

<div id="drawer">
  <div id="drawer-head">
    <div>
      <p id="drawer-title">Frame</p>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"

<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const wrap = document.getElementById('canvas-wrap');
const loadingEl = document.getElementById('loading');
const scrollHint = document.getElementById('scroll-hint');
const outroLine = document.getElementById('outro-line');
const heroStarfield = document.getElementById('hero-starfield');
const shopInfo = document.getElementById('shop-info');
const chapterFade = document.getElementById('chapter-fade');
const transitionWords = document.getElementById('transition-words');
const backBtn = document.getElementById('back-btn');
const drawer = document.getElementById('drawer');
const drawerTitle = document.getElementById('drawer-title');
const productRow = document.getElementById('product-row');
const adminToggle = document.getElementById('admin-toggle');
const scrollSpacer = document.getElementById('scroll-spacer');

/* ============================================================
   ADMIN PIN — client-side only. NOT real security.
   ============================================================ */
const ADMIN_PIN = '2580';
let isAdmin = false;
const pinBackdrop = document.getElementById('pin-backdrop');
const pinInput = document.getElementById('pin-input');
document.getElementById('pin-submit').addEventListener('click', submitPin);
pinInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') submitPin(); });
function submitPin() {
  if (pinInput.value === ADMIN_PIN) {
    isAdmin = true;
    document.body.classList.add('admin');
    adminToggle.classList.add('on');
    pinBackdrop.classList.remove('open');
    pinInput.value = '';
    renderProducts(activePart || 'frame');
  } else {
    pinInput.value = '';
    pinInput.placeholder = 'wrong pin';
  }
}
adminToggle.addEventListener('click', () => {
  if (isAdmin) {
    isAdmin = false;
    document.body.classList.remove('admin');
    adminToggle.classList.remove('on');
    renderProducts(activePart || 'frame');
  } else {
    pinBackdrop.classList.add('open');
    pinInput.focus();
  }
});

/* ============================================================
   PRODUCT DATA — two categories now: frame (incl. temples), lenses
   ============================================================ */
const STORAGE_KEY = 'onyx_products_v2';
const DEFAULT_PRODUCTS = {
  frame: [
    { id: 'f1', name: 'Kilimanjaro', price: '$85', color: '#3a3a3d' },
    { id: 'f2', name: 'Serengeti', price: '$92', color: '#5a4632' },
    { id: 'f3', name: 'Zanzibar', price: '$78', color: '#8a3b32' },
    { id: 'f4', name: 'Walnut Temple', price: '$28', color: '#7a5230' },
  ],
  lenses: [
    { id: 'l1', name: 'Clear UV400', price: '$25', color: '#cfd6da' },
    { id: 'l2', name: 'Amber Tint', price: '$32', color: '#b9863f' },
    { id: 'l3', name: 'Polarized Grey', price: '$40', color: '#4a4d52' },
  ],
  // Placeholder — swap in the client's real sunglasses catalog
  sunglasses: [
    { id: 's1', name: 'Serengeti Sun', price: '$65', color: '#2a2a2a' },
    { id: 's2', name: 'Zanzibar Sun', price: '$70', color: '#5a3a20' },
    { id: 's3', name: 'Kilimanjaro Sun', price: '$72', color: '#1e1e22' },
  ]
};
function loadProducts() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) return JSON.parse(raw);
  } catch (e) {}
  return JSON.parse(JSON.stringify(DEFAULT_PRODUCTS));
}
function saveProducts() { localStorage.setItem(STORAGE_KEY, JSON.stringify(products)); }
let products = loadProducts();

const PART_LABELS = { frame: 'Frame', lenses: 'Lenses', sunglasses: 'Sunglasses' };

function renderProducts(partId) {
  drawerTitle.textContent = PART_LABELS[partId] || partId;
  productRow.innerHTML = '';
  (products[partId] || []).forEach((p) => {
    const card = document.createElement('div');
    card.className = 'product-card';
    card.innerHTML = `
      <div class="product-remove" data-id="${p.id}">✕</div>
      <div class="product-swatch" style="background:${p.color}"></div>
      <div class="product-info">
        <p class="product-name">${p.name}</p>
        <p class="product-price">${p.price}</p>
      </div>`;
    card.querySelector('.product-remove').addEventListener('click', (e) => {
      e.stopPropagation();
      products[partId] = products[partId].filter(x => x.id !== p.id);
      saveProducts();
      renderProducts(partId);
    });
    productRow.appendChild(card);
  });
  const addCard = document.createElement('div');
  addCard.className = 'add-card';
  addCard.textContent = '+';
  addCard.addEventListener('click', () => openAddModal(partId));
  productRow.appendChild(addCard);
}

const modalBackdrop = document.getElementById('modal-backdrop');
const mName = document.getElementById('m-name');
const mPrice = document.getElementById('m-price');
const mColor = document.getElementById('m-color');
let modalPart = 'frame';
function openAddModal(partId) {
  modalPart = partId;
  mName.value = ''; mPrice.value = ''; mColor.value = '#c9a24a';
  modalBackdrop.classList.add('open');
  mName.focus();
}
document.getElementById('modal-cancel').addEventListener('click', () => modalBackdrop.classList.remove('open'));
document.getElementById('modal-save').addEventListener('click', () => {
  if (!mName.value.trim()) return;
  const id = 'p' + Date.now();
  products[modalPart] = products[modalPart] || [];
  products[modalPart].push({ id, name: mName.value.trim(), price: mPrice.value.trim() || '—', color: mColor.value });
  saveProducts();
  modalBackdrop.classList.remove('open');
  renderProducts(modalPart);
});

/* ============================================================
   THREE.JS SCENE
   ============================================================ */
const scene = new THREE.Scene();

// Two backdrop textures: neutral studio vignette for the glasses,
// warm sunlit gradient for the sunglasses. Swapped during the chapter
// transition rather than lerped, since it happens behind a black fade.
function makeGradientTexture(stops, size = 512) {
  const c = document.createElement('canvas');
  c.width = size; c.height = size;
  const ctx = c.getContext('2d');
  const grad = ctx.createRadialGradient(size * 0.5, size * 0.55, size * 0.05, size * 0.5, size * 0.55, size * 0.75);
  stops.forEach(([offset, color]) => grad.addColorStop(offset, color));
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, size, size);
  const tex = new THREE.CanvasTexture(c);
  tex.colorSpace = THREE.SRGBColorSpace;
  return tex;
}
const studioBgTexture = makeGradientTexture([[0, '#3a3a3d'], [0.45, '#1c1c1f'], [1, '#000000']]);
const sunnyBgTexture = makeGradientTexture([[0, '#ffd98a'], [0.35, '#e08a3c'], [0.7, '#5b3a2a'], [1, '#0c0805']]);
scene.background = studioBgTexture;

const camera = new THREE.PerspectiveCamera(35, window.innerWidth / window.innerHeight, 0.01, 100);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;
wrap.appendChild(renderer.domElement);

const key = new THREE.DirectionalLight(0xffffff, 2.3); key.position.set(2, 2, 3); scene.add(key);
const fill = new THREE.DirectionalLight(0xbcd0ff, 0.7); fill.position.set(-3, 0.5, 1); scene.add(fill);
const rim = new THREE.DirectionalLight(0xffe9c2, 1.3); rim.position.set(0, 2, -3); scene.add(rim);
scene.add(new THREE.AmbientLight(0xffffff, 0.25));

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.minDistance = 0.05;
controls.maxDistance = 8;
controls.enablePan = false;
// Zoom is wheel-bound in OrbitControls, and the canvas covers the full
// viewport — leaving zoom on would swallow every wheel-scroll once
// controls are enabled, making it impossible to scroll into the next
// chapter. Rotate (drag) still works fine with zoom off.
controls.enableZoom = false;
controls.enabled = false; // enabled once a chapter settles

let userDragging = false;
controls.addEventListener('start', () => { userDragging = true; });
controls.addEventListener('end', () => { userDragging = false; });

// Two logical parts now — temples fold into "frame"
const PART_NODE_NAMES = { frame: ['Frame_1', 'Handles_2'], lenses: ['Glasses_3'] };
const partObjects = {}; // id -> array of THREE.Object3D
let modelRoot = null;
let defaultCamPos = null;   // fully "arrived" hero framing
let heroFarCamPos = null;   // pulled-back starting point for scroll drift
let heroFarTarget = new THREE.Vector3();
const defaultTarget = new THREE.Vector3(0, 0, 0);
let activePart = null;
let animId = null;
let heroComplete = false;   // glasses arrived and resting (chapter 1 settled)

// Sunglasses — chapter 2, no part hotspots, just arrival + flat product list
let sunModelRoot = null;
let sunDefaultCamPos = null;
let sunFarCamPos = null;
const sunFarTarget = new THREE.Vector3();
let sunComplete = false;    // sunglasses arrived and resting (chapter 2 settled)

const hotspotEls = {};

/* Shared box-fit helper: centers/scales a model and derives the near
   (arrived) and far (scroll-start) camera positions for it. */
function normalizeAndFit(root, farMul) {
  const box = new THREE.Box3().setFromObject(root);
  const size = new THREE.Vector3(); box.getSize(size);
  const center = new THREE.Vector3(); box.getCenter(center);
  root.position.sub(center);

  const maxDim = Math.max(size.x, size.y, size.z);
  root.scale.setScalar(1.5 / maxDim);

  const box2 = new THREE.Box3().setFromObject(root);
  const size2 = new THREE.Vector3(); box2.getSize(size2);
  const fitDist = (Math.max(size2.x, size2.y, size2.z) / 2) / Math.tan((camera.fov * Math.PI / 180) / 2) * 1.7;

  return {
    defaultCamPos: new THREE.Vector3(0, 0, fitDist),
    farCamPos: new THREE.Vector3(fitDist * farMul.x, fitDist * farMul.y, fitDist * farMul.z)
  };
}

/* Scattered stars for the hero-opening background overlay */
(function seedStarfield() {
  const COUNT = 90;
  for (let i = 0; i < COUNT; i++) {
    const s = document.createElement('div');
    s.className = 'star';
    const big = Math.random() < 0.08;
    const size = big ? (2 + Math.random() * 1.5) : (0.5 + Math.random() * 1.2);
    s.style.width = size + 'px';
    s.style.height = size + 'px';
    s.style.left = (Math.random() * 100) + 'vw';
    s.style.top = (Math.random() * 100) + 'vh';
    s.style.opacity = big ? String(0.7 + Math.random() * 0.3) : String(0.2 + Math.random() * 0.4);
    heroStarfield.appendChild(s);
  }
})();

const loader = new GLTFLoader();
loader.load('glasses.glb', (gltf) => {
  modelRoot = gltf.scene;
  scene.add(modelRoot);

  const fit = normalizeAndFit(modelRoot, { x: 1.9, y: 0.55, z: 1.6 });
  defaultCamPos = fit.defaultCamPos;
  heroFarCamPos = fit.farCamPos;
  heroFarTarget.set(0, 0, 0);

  camera.position.copy(heroFarCamPos);
  controls.target.copy(defaultTarget);
  controls.update();

  Object.entries(PART_NODE_NAMES).forEach(([id, nodeNames]) => {
    const objs = nodeNames.map(n => modelRoot.getObjectByName(n)).filter(Boolean);
    if (objs.length) partObjects[id] = objs;
  });

  const nodeToPart = {};
  Object.entries(PART_NODE_NAMES).forEach(([id, names]) => names.forEach(n => nodeToPart[n] = id));

  modelRoot.traverse((child) => {
    if (child.isMesh) {
      let p = child;
      while (p && !p.userData.partId) {
        if (nodeToPart[p.name]) p.userData.partId = nodeToPart[p.name];
        p = p.parent;
      }
    }
  });

  createHotspots();
  loadingEl.style.display = 'none';
}, undefined, (err) => {
  loadingEl.textContent = 'Could not load model.';
  console.error(err);
});

loader.load('sun_glasses.glb', (gltf) => {
  sunModelRoot = gltf.scene;
  sunModelRoot.visible = false;
  scene.add(sunModelRoot);

  const fit = normalizeAndFit(sunModelRoot, { x: -1.7, y: 0.5, z: 1.8 });
  sunDefaultCamPos = fit.defaultCamPos;
  sunFarCamPos = fit.farCamPos;
  sunFarTarget.set(0, 0, 0);
}, undefined, (err) => {
  console.error('Could not load sun_glasses.glb', err);
});

function createHotspots() {
  Object.keys(partObjects).forEach((id) => {
    const el = document.createElement('div');
    el.className = 'hotspot';
    el.style.opacity = '0';
    el.style.pointerEvents = 'none';
    el.innerHTML = `<span class="dot"></span><span class="pill">${PART_LABELS[id]}</span>`;
    el.addEventListener('click', () => focusPart(id));
    document.body.appendChild(el);
    hotspotEls[id] = el;
  });
}

function unionBox(objs) {
  const box = new THREE.Box3();
  objs.forEach((o, i) => {
    const b = new THREE.Box3().setFromObject(o);
    if (i === 0) box.copy(b); else box.union(b);
  });
  return box;
}

const raycaster = new THREE.Raycaster();
const pointer = new THREE.Vector2();
renderer.domElement.addEventListener('click', (event) => {
  if (!modelRoot || !heroComplete) return;
  pointer.x = (event.clientX / window.innerWidth) * 2 - 1;
  pointer.y = -(event.clientY / window.innerHeight) * 2 + 1;
  raycaster.setFromCamera(pointer, camera);
  const hits = raycaster.intersectObject(modelRoot, true);
  if (hits.length > 0) {
    let obj = hits[0].object;
    while (obj && !obj.userData.partId) obj = obj.parent;
    if (obj && obj.userData.partId) focusPart(obj.userData.partId);
  }
});

function focusPart(id) {
  const targets = partObjects[id];
  if (!targets) return;

  activePart = id;
  Object.entries(hotspotEls).forEach(([pid, el]) => el.classList.toggle('active', pid === id));

  const box = unionBox(targets);
  const center = new THREE.Vector3(); box.getCenter(center);
  const size = new THREE.Vector3(); box.getSize(size);
  const radius = Math.max(size.x, size.y, size.z, 0.05);

  // Tight, decisive zoom — closer multiplier than before
  const dist = radius / Math.tan((camera.fov * Math.PI / 180) / 2) * 1.35;
  const dir = camera.position.clone().sub(controls.target).normalize();
  const newCamPos = center.clone().add(dir.multiplyScalar(dist));

  animateCamera(newCamPos, center, 550);
  backBtn.classList.add('visible');
  renderProducts(id);
  drawer.classList.add('open');
}

function resetView() {
  activePart = null;
  Object.values(hotspotEls).forEach(el => el.classList.remove('active'));
  animateCamera(defaultCamPos, defaultTarget, 600);
  backBtn.classList.remove('visible');
  drawer.classList.remove('open');
}
backBtn.addEventListener('click', resetView);

function animateCamera(toPos, toTarget, duration) {
  if (animId) cancelAnimationFrame(animId);
  const fromPos = camera.position.clone();
  const fromTarget = controls.target.clone();
  const start = performance.now();
  controls.enabled = false;
  function step(now) {
    const t = Math.min(1, (now - start) / duration);
    const e = 1 - Math.pow(1 - t, 3);
    camera.position.lerpVectors(fromPos, toPos, e);
    controls.target.lerpVectors(fromTarget, toTarget, e);
    controls.update();
    if (t < 1) { animId = requestAnimationFrame(step); }
    else { controls.enabled = true; }
  }
  animId = requestAnimationFrame(step);
}

/* ---------- Scroll-driven two-chapter drift ---------- */
const CH1_END = 0.5; // first half of the spacer = glasses chapter

function scrollProgress() {
  const max = scrollSpacer.offsetHeight - window.innerHeight;
  if (max <= 0) return 1;
  return Math.min(1, Math.max(0, window.scrollY / max));
}

function updateScrollDrift() {
  if (!modelRoot || userDragging) return;
  const t = scrollProgress();
  const t1 = Math.min(1, t / CH1_END);
  const t2 = Math.max(0, Math.min(1, (t - CH1_END) / (1 - CH1_END)));
  const e1 = t1 * t1 * (3 - 2 * t1);

  // ---- Chapter 1: glasses arrival (only while chapter 2 hasn't started) ----
  if (t2 <= 0) {
    camera.position.lerpVectors(heroFarCamPos, defaultCamPos, e1);
    controls.target.lerpVectors(heroFarTarget, defaultTarget, e1);
    controls.update();
  }

  scrollHint.style.opacity = t1 > 0.06 ? '0' : '1';
  heroStarfield.style.opacity = String(Math.max(0, 1 - e1));

  const outroRaw = t1 < 0.55 ? 0
    : t1 < 0.65 ? (t1 - 0.55) / 0.10
    : t1 < 0.70 ? 1
    : t1 < 0.78 ? 1 - (t1 - 0.70) / 0.08
    : 0;
  const clearForCh2 = 1 - Math.min(1, t2 * 4);
  outroLine.style.opacity = String(outroRaw * clearForCh2);

  const glassesReveal = Math.max(0, Math.min(1, (t1 - 0.75) / 0.25)) * clearForCh2;
  Object.values(hotspotEls).forEach(el => { el.style.opacity = String(glassesReveal); });
  shopInfo.style.opacity = String(glassesReveal);
  shopInfo.style.pointerEvents = (glassesReveal > 0.5 && t2 <= 0) ? 'auto' : 'none';

  // ---- Transition: fade to black, swap model + backdrop, fade back in ----
  let fadeOpacity = 0;
  if (t2 > 0 && t2 < 0.65) {
    fadeOpacity = t2 < 0.15 ? t2 / 0.15
      : t2 < 0.45 ? 1
      : 1 - (t2 - 0.45) / 0.20;
  }
  chapterFade.style.opacity = String(Math.max(0, fadeOpacity));

  const wordsRaw = (t2 > 0.10 && t2 < 0.50)
    ? Math.min(1, (t2 - 0.10) / 0.08) * (t2 < 0.42 ? 1 : Math.max(0, 1 - (t2 - 0.42) / 0.08))
    : 0;
  transitionWords.style.opacity = String(Math.max(0, wordsRaw));

  const showSun = t2 >= 0.30;
  if (showSun && modelRoot.visible) {
    modelRoot.visible = false;
    if (sunModelRoot) sunModelRoot.visible = true;
    scene.background = sunnyBgTexture;
    backBtn.classList.remove('visible');
    activePart = null;
    Object.values(hotspotEls).forEach(el => el.classList.remove('active'));
  } else if (!showSun && !modelRoot.visible) {
    modelRoot.visible = true;
    if (sunModelRoot) sunModelRoot.visible = false;
    scene.background = studioBgTexture;
    drawer.classList.remove('open');
  }

  // ---- Chapter 2: sunglasses arrival + flat product reveal ----
  if (sunModelRoot && sunDefaultCamPos && t2 > 0) {
    const t2drift = Math.max(0, Math.min(1, (t2 - 0.65) / 0.35));
    const e2 = t2drift * t2drift * (3 - 2 * t2drift);
    if (t2 >= 0.30) {
      camera.position.lerpVectors(sunFarCamPos, sunDefaultCamPos, e2);
      controls.target.lerpVectors(sunFarTarget, defaultTarget, e2);
      controls.update();
    }
    const sunReveal = Math.max(0, Math.min(1, (t2 - 0.85) / 0.15));
    if (sunReveal > 0 && !drawer.classList.contains('open')) {
      renderProducts('sunglasses');
      drawer.classList.add('open');
    } else if (sunReveal <= 0 && t2 > 0.30 && drawer.classList.contains('open')) {
      drawer.classList.remove('open');
    }
  }

  // ---- Settle / interaction handoff ----
  const settledGlasses = t1 >= 0.999 && t2 <= 0.001;
  const settledSun = t2 >= 0.999;

  if (settledGlasses && !heroComplete) {
    heroComplete = true;
    Object.values(hotspotEls).forEach(el => { el.style.pointerEvents = 'auto'; });
  } else if (!settledGlasses && heroComplete) {
    heroComplete = false;
    Object.values(hotspotEls).forEach(el => { el.style.pointerEvents = 'none'; });
  }

  if (settledSun && !sunComplete) {
    sunComplete = true;
  } else if (!settledSun && sunComplete) {
    sunComplete = false;
  }

  controls.enabled = heroComplete || sunComplete;
}
window.addEventListener('scroll', updateScrollDrift, { passive: true });

const projVec = new THREE.Vector3();
function updateHotspotPositions() {
  Object.entries(partObjects).forEach(([id, objs]) => {
    const el = hotspotEls[id];
    if (!el) return;
    const box = unionBox(objs);
    box.getCenter(projVec);
    projVec.project(camera);
    const x = (projVec.x * 0.5 + 0.5) * window.innerWidth;
    const y = (-projVec.y * 0.5 + 0.5) * window.innerHeight;
    el.style.left = x + 'px';
    el.style.top = y + 'px';
    if (heroComplete || projVec.z >= 1) {
      el.style.opacity = projVec.z < 1 ? '1' : '0';
    }
  });
}

function animate() {
  requestAnimationFrame(animate);
  if (heroComplete || sunComplete || userDragging) controls.update();
  renderer.render(scene, camera);
  if (modelRoot) {
    updateHotspotPositions();
    updateScrollDrift();
  }
}
animate();

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

/* Idle logo drift follows mouse for ambient life */
const logo = document.getElementById('logo');
window.addEventListener('mousemove', (e) => {
  const nx = (e.clientX / window.innerWidth - 0.5) * 6;
  logo.style.marginLeft = nx + 'px';
});
</script>
</body>
</html>
